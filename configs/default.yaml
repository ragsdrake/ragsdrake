# Standardkonfiguration für den Insekten-Tracker.
# Einzelne Werte lassen sich per --source/--config Argumenten der CLI überschreiben.

source:
  type: webcam        # webcam | picamera | video_file
  device_index: 0      # genutzt von webcam
  video_path: null     # genutzt von video_file

detector:
  weights: models/insect_yolo.pt   # Eigenes IP102-YOLO-Modell (102 Schädlingsklassen).
                                     # Datei liegt nicht im Repo (siehe .gitignore) -
                                     # lokal nach dem Training dort ablegen.
  confidence: 0.35
  device: cuda            # cpu | cuda | mps

tracker:
  iou_threshold: 0.3
  max_age: 15

storage:
  db_path: data/sightings.db

api:
  host: 0.0.0.0
  port: 8000
