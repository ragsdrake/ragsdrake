[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insect-tracker"
version = "0.1.0"
description = "Kamerabasierte Erkennung und Tracking von Insekten"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.2",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pi = ["picamera2"]
dev = ["pytest>=8.0"]

[project.scripts]
insect-tracker = "insect_tracker.cli:main"
insect-tracker-api = "insect_tracker.cli:serve"

[tool.setuptools.packages.find]
where = ["src"]
